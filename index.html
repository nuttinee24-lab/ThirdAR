<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>TERA AR Product Viewer</title>

  <!-- AR.js 3.4.7 + A-Frame 1.6.0 (version pair recommended by AR.js docs) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0, 0, 0, 0.68);
      font-size: 14px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      z-index: 20;
      top: calc(max(14px, env(safe-area-inset-top)) + 48px);
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.52);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
      text-align: center;
      max-width: min(90vw, 520px);
    }

    #controls {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: min(94vw, 620px);
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-width: 52px;
      height: 44px;
      padding: 0 14px;
      color: #fff;
      background: rgba(20, 20, 20, 0.82);
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    button:active { transform: scale(.96); }
    button.primary { background: rgba(255, 35, 1, 0.92); }

    .a-enter-vr, .a-orientation-modal { display: none !important; }
  </style>
</head>
<body>
  <div id="status">กำลังค้นหา AR Marker…</div>
  <div id="hint">ลากซ้าย/ขวาเพื่อหมุนสินค้า • ลากขึ้น/ลงเพื่อเอียง • ใช้ 2 นิ้วเพื่อย่อ/ขยาย</div>

  <div id="controls">
    <button id="leftBtn" aria-label="หมุนซ้าย">↶</button>
    <button id="spinBtn" class="primary">หมุนอัตโนมัติ</button>
    <button id="rightBtn" aria-label="หมุนขวา">↷</button>
    <button id="zoomOutBtn" aria-label="ย่อ">−</button>
    <button id="zoomInBtn" aria-label="ขยาย">＋</button>
    <button id="resetBtn">รีเซ็ต</button>
  </div>

    <!-- Custom AR.js Pattern Marker: วาง marker.patt ไว้โฟลเดอร์เดียวกับ index.html -->
    <a-marker id="marker" type="pattern" url="marker.patt" emitevents="true">

      <!-- เงาบนพื้น Marker ช่วยให้สินค้าดูมีมิติ -->
      <a-circle
        radius="0.48"
        rotation="-90 0 0"
        position="0 0.006 0"
        material="color: #000; opacity: 0.18; transparent: true; depthWrite: false"
      ></a-circle>

      <!-- Product root: หมุน/เอียง/ซูมทั้งชุดจาก JavaScript -->
      <a-entity id="productRoot" position="0 0 0" rotation="0 0 0" scale="1 1 1">
        <!-- แกน/ความหนาจำลอง เพื่อให้ภาพถ่าย 2D หมุนแล้วดูคล้ายวัตถุ 3D -->
        <a-box
          width="0.70"
          height="1.18"
          depth="0.15"
          position="0 0.60 0"
          material="color: #d8d4ca; roughness: 0.9; metalness: 0.02"
        ></a-box>

        <!-- ด้านหน้า -->
        <a-plane
          src="#productImage"
          width="0.68"
          height="1.16"
          position="0 0.60 0.076"
          material="shader: flat; side: double"
        ></a-plane>

        <!-- ด้านหลัง: ใช้ภาพเดิมเพื่อให้ยังเห็นสินค้าเมื่อหมุนกลับด้าน -->
        <a-plane
          src="#productImage"
          width="0.68"
          height="1.16"
          position="0 0.60 -0.076"
          rotation="0 180 0"
          material="shader: flat; side: double"
        ></a-plane>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (() => {
      const marker = document.querySelector('#marker');
      const product = document.querySelector('#productRoot');
      const scene = document.querySelector('a-scene');
      const status = document.querySelector('#status');
      const spinBtn = document.querySelector('#spinBtn');

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      let rotX = 0;
      let rotY = 0;
      let scale = 1;
      let autoSpin = false;
      let lastFrame = performance.now();

      // pointerId -> {x,y}
      const pointers = new Map();
      let lastPinchDistance = null;

      function applyTransform() {
        product.object3D.rotation.x = THREE.MathUtils.degToRad(rotX);
        product.object3D.rotation.y = THREE.MathUtils.degToRad(rotY);
        product.object3D.scale.setScalar(scale);
      }

      function setScale(next) {
        scale = clamp(next, 0.55, 2.1);
        applyTransform();
      }

      function rotateY(deltaDegrees) {
        rotY += deltaDegrees;
        applyTransform();
      }

      function resetProduct() {
        rotX = 0;
        rotY = 0;
        scale = 1;
        autoSpin = false;
        spinBtn.textContent = 'หมุนอัตโนมัติ';
        applyTransform();
      }

      marker.addEventListener('markerFound', () => {
        status.textContent = 'พบ Marker แล้ว — หมุนสินค้าได้เลย';
        status.style.background = 'rgba(22, 110, 48, 0.78)';
      });

      marker.addEventListener('markerLost', () => {
        status.textContent = 'ไม่พบ Marker — หันกล้องกลับไปที่ AR Marker';
        status.style.background = 'rgba(0, 0, 0, 0.68)';
      });

      document.querySelector('#leftBtn').addEventListener('click', () => rotateY(-20));
      document.querySelector('#rightBtn').addEventListener('click', () => rotateY(20));
      document.querySelector('#zoomInBtn').addEventListener('click', () => setScale(scale + 0.12));
      document.querySelector('#zoomOutBtn').addEventListener('click', () => setScale(scale - 0.12));
      document.querySelector('#resetBtn').addEventListener('click', resetProduct);

      spinBtn.addEventListener('click', () => {
        autoSpin = !autoSpin;
        spinBtn.textContent = autoSpin ? 'หยุดหมุน' : 'หมุนอัตโนมัติ';
      });

      function pinchDistance() {
        if (pointers.size < 2) return null;
        const pts = [...pointers.values()];
        return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }

      function bindCanvasInteractions() {
        const canvas = scene.canvas;
        if (!canvas) return;

        canvas.style.touchAction = 'none';

        canvas.addEventListener('pointerdown', (e) => {
          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
          if (pointers.size === 2) lastPinchDistance = pinchDistance();
        });

        canvas.addEventListener('pointermove', (e) => {
          const prev = pointers.get(e.pointerId);
          if (!prev) return;

          const next = { x: e.clientX, y: e.clientY };
          pointers.set(e.pointerId, next);

          if (pointers.size >= 2) {
            const d = pinchDistance();
            if (lastPinchDistance && d) {
              setScale(scale * (d / lastPinchDistance));
            }
            lastPinchDistance = d;
            return;
          }

          // หยุด auto-spin ชั่วคราวเมื่อผู้ใช้เริ่มหมุนเอง
          autoSpin = false;
          spinBtn.textContent = 'หมุนอัตโนมัติ';

          const dx = next.x - prev.x;
          const dy = next.y - prev.y;
          rotY += dx * 0.45;
          rotX = clamp(rotX + dy * 0.28, -35, 35);
          applyTransform();
        });

        const release = (e) => {
          pointers.delete(e.pointerId);
          if (pointers.size < 2) lastPinchDistance = null;
        };
        canvas.addEventListener('pointerup', release);
        canvas.addEventListener('pointercancel', release);
        canvas.addEventListener('pointerleave', release);

        // เมาส์ wheel สำหรับทดสอบบนคอม
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          setScale(scale + (e.deltaY < 0 ? 0.08 : -0.08));
        }, { passive: false });
      }

      scene.addEventListener('render-target-loaded', bindCanvasInteractions);

      // Auto-spin แบบ frame-rate independent
      function tick(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        if (autoSpin) {
          rotY += 45 * dt; // 45° ต่อวินาที
          applyTransform();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      applyTransform();
    })();
  </script>
</body>
</html>
